# PostgreSQL for the Pattern server (local development and a single VPS).
#   pnpm db:up        start it
#   pnpm db:migrate   apply the schema
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pattern
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pattern}
      POSTGRES_DB: pattern
    ports:
      # only on this machine; the server connects through localhost
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/server/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pattern"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The NestJS server (apps/server/Dockerfile). Applies migrations on start.
  #   docker compose up -d --build server
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: pattern-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pattern:${POSTGRES_PASSWORD:-pattern}@db:5432/pattern
      NODE_ENV: production
      PORT: 3000
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      # secure cookies need HTTPS: set COOKIE_SECURE=true behind a TLS reverse proxy
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # behind Caddy/nginx add TRUST_PROXY: 1; web app on another host add WEB_ORIGIN
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
