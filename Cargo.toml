[workspace]
resolver = "2"
members = ["crates/engine", "crates/engine-wasm", "crates/engine-cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libm = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
